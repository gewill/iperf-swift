name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: brew install iperf3 openssl@3
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test

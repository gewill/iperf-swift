name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "codex/**"]

jobs:
  sync:
    name: Sync reproducibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify synchronization safety and reproducibility
        run: |
          mkdir -p iperf3 Sources/IperfCLib.sync-tmp
          touch iperf3/sentinel Sources/IperfCLib.sync-tmp/sentinel
          mkdir .iperf-sync.lock
          touch .iperf-sync.lock/sentinel
          if lock_output="$(./sync.sh 2>&1)"; then
            echo "Synchronization unexpectedly ignored an existing lock" >&2
            exit 1
          fi
          echo "$lock_output"
          grep -Fq 'rmdir .iperf-sync.lock' <<< "$lock_output"
          test -f .iperf-sync.lock/sentinel
          rm .iperf-sync.lock/sentinel
          rmdir .iperf-sync.lock
          ./sync.sh
          test -f iperf3/sentinel
          test -f Sources/IperfCLib.sync-tmp/sentinel
          test ! -e .iperf-sync.lock
          test -z "$(find Sources -maxdepth 1 -name '.IperfCLib-sync.*' -print -quit)"
          git diff --exit-code -- Sources/IperfCLib

  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Pin the CLI to the embedded engine; Homebrew's latest iperf3 can drift.
      # This CLI's OpenSSL does not change package linking via openssl-spm.
      - name: Install test dependencies
        run: |
          brew install openssl@3
          ./Scripts/install_test_iperf3.sh "$RUNNER_TEMP/iperf3-3.22"
          echo "IPERF3_PATH=$RUNNER_TEMP/iperf3-3.22/bin/iperf3" >> "$GITHUB_ENV"
          echo "OPENSSL_PATH=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Build
        run: swift build
      # The DocC catalog and doc comments contain many ``symbol`` links that a
      # rename breaks silently; fail the build on any unresolved link.
      - name: Build documentation
        run: swift package generate-documentation --target IperfSwift --warnings-as-errors
      - name: Run tests
        run: swift test
      - name: Verify authentication and engine regressions with AddressSanitizer
        run: |
          ./Scripts/verify_auth_safety.sh
          ./Scripts/verify_engine_regressions.sh
      # HAVE_SSL is hardcoded on, so the no-SSL fallback in custom.c is never
      # compiled by swift build/test. Exercise it directly so the unconditional
      # RSA-validation declarations can never regress into a link failure.
      - name: Verify no-SSL RSA-validation stubs
        run: ./Scripts/verify_no_ssl_stubs.sh

  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    steps:
      - uses: actions/checkout@v5
      # Verify the declared-supported platforms compile. Running the test
      # suite there needs a simulator/host; a build is the cheap guard.
      - name: Build for ${{ matrix.platform }}
        run: xcodebuild -scheme IperfSwift -destination 'generic/platform=${{ matrix.platform }}' build

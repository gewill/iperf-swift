name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Homebrew's official iperf3 bottle supplies its OpenSSL CLI dependency.
      # Package linking still comes exclusively from openssl-spm.
      - name: Install test dependencies
        run: |
          brew install iperf3
          version_output="$(iperf3 --version 2>&1)"
          first_line="${version_output%%$'\n'*}"
          if [[ ! "$first_line" =~ ^iperf\ 3\.21([[:space:]]|\() ]]; then
            echo "Expected iperf 3.21, got: $first_line" >&2
            exit 1
          fi
          if [[ "$version_output" != *authentication* ]]; then
            echo "The installed iperf3 does not report authentication support" >&2
            exit 1
          fi
          echo "IPERF3_PATH=$(command -v iperf3)" >> "$GITHUB_ENV"
      - name: Build
        run: swift build
      # The DocC catalog and doc comments contain many ``symbol`` links that a
      # rename breaks silently; fail the build on any unresolved link.
      - name: Build documentation
        run: swift package generate-documentation --target IperfSwift --warnings-as-errors
      - name: Run tests
        run: swift test
      # HAVE_SSL is hardcoded on, so the no-SSL fallback in custom.c is never
      # compiled by swift build/test. Exercise it directly so the unconditional
      # RSA-validation declarations can never regress into a link failure.
      - name: Verify no-SSL RSA-validation stubs
        run: ./Scripts/verify_no_ssl_stubs.sh

  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    steps:
      - uses: actions/checkout@v5
      # Verify the declared-supported platforms compile. Running the test
      # suite there needs a simulator/host; a build is the cheap guard.
      - name: Build for ${{ matrix.platform }}
        run: xcodebuild -scheme IperfSwift -destination 'generic/platform=${{ matrix.platform }}' build
